name: Flutter CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Caches ────────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android CMake
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-cmake-3.22.1

      # ── Android SDK setup ─────────────────────────────────────────────────
      - name: Accept licenses & pre-install CMake
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --licenses > /dev/null 2>&1
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "cmake;3.22.1"

      # ── App setup ─────────────────────────────────────────────────────────
      - name: Create CI env file
        run: |
          echo "SCRIPT_URL=${{ secrets.SCRIPT_URL }}" > .env
          echo "WORKER_URL=${{ secrets.WORKER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get

      # ── Quality gates ──────────────────────────────────────────────────────
      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build Split APKs (arm64-v8a · armeabi-v7a · x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release
        # Gradle reuses compiled artifacts from above — significantly faster

      # ── Upload all 4 APKs ─────────────────────────────────────────────────
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error